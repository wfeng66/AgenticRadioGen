<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100">
  <rect width="720" height="1100" fill="#2b2b2b"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <style>
      .box { fill: none; stroke: #ffffff; stroke-width: 1.5; }
      .label { fill: #ffffff; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; text-anchor: middle; }
      .llm { font-style: italic; font-size: 20px; }
      .caption { fill: #d8d8d8; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; text-anchor: middle; font-style: normal; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <!-- ResearchQuestion -->
  <rect class="box" x="470" y="36" width="200" height="44" rx="2"/>
  <text class="label" x="570" y="64">ResearchQuestion</text>
  <line x1="470" y1="58" x2="410" y2="58" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OrchestratorPlanner (LLM) -->
  <rect class="box" x="210" y="36" width="200" height="44" rx="2"/>
  <text class="label llm" x="310" y="64">OrchestratorPlanner</text>

  <line x1="310" y1="80" x2="310" y2="108" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="360" y="100">DataRequest</text>

  <!-- Literature prepare (LLM) -->
  <rect class="box" x="230" y="112" width="160" height="40" rx="2"/>
  <text class="label llm" x="310" y="138">Literature</text>
  <line x1="310" y1="152" x2="310" y2="178" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="400" y="172">disease priors / prepare</text>

  <!-- DataMatcher (LLM) -->
  <rect class="box" x="200" y="182" width="220" height="78" rx="2"/>
  <text class="label llm" x="310" y="210">DataMatcher</text>
  <rect class="box" x="245" y="222" width="130" height="28" rx="2"/>
  <text class="caption small" x="310" y="240">LiveCatalog · TCIA ) GDC</text>

  <line x1="310" y1="260" x2="310" y2="292" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="caption" x="310" y="282">ImageBundle + OmicsBundle</text>

  <!-- Branch labels -->
  <rect class="box" x="110" y="298" width="150" height="34" rx="2"/>
  <text class="caption" x="185" y="320">needed images only</text>
  <rect class="box" x="360" y="298" width="170" height="34" rx="2"/>
  <text class="caption" x="445" y="320">needed genetic data only</text>

  <path d="M310,292 L185,298" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M310,292 L445,298" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Segmentation (LLM) -->
  <line x1="185" y1="332" x2="185" y2="358" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="box" x="95" y="360" width="180" height="40" rx="2"/>
  <text class="label llm" x="185" y="386">Segmentation</text>
  <text class="caption small" x="185" y="418">nnU-Net / MONAI / AutoPET / TotalSegmentator</text>

  <!-- ImagingRadiomics -->
  <line x1="185" y1="426" x2="185" y2="458" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="box" x="95" y="460" width="180" height="40" rx="2"/>
  <text class="label" x="185" y="486">ImagingRadiomics</text>

  <!-- Genomics -->
  <line x1="445" y1="332" x2="445" y2="458" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="box" x="355" y="460" width="180" height="40" rx="2"/>
  <text class="label" x="445" y="486">Genomics</text>

  <!-- Merge to StatisticalCritical -->
  <path d="M185,500 L185,530 L310,530 L310,558" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M445,500 L445,530 L310,530" stroke="#fff" stroke-width="1.5" fill="none"/>
  <rect class="box" x="200" y="560" width="220" height="40" rx="2"/>
  <text class="label" x="310" y="586">StatisticalCritical</text>

  <!-- Literature annotate (LLM) -->
  <line x1="310" y1="600" x2="310" y2="628" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="box" x="230" y="630" width="160" height="40" rx="2"/>
  <text class="label llm" x="310" y="656">Literature</text>
  <text class="caption" x="430" y="652">annotate associations</text>

  <!-- DiscoveryLoop -->
  <line x1="310" y1="670" x2="310" y2="708" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="box" x="200" y="710" width="220" height="56" rx="2"/>
  <text class="label" x="310" y="734">DiscoveryLoop</text>
  <text class="caption small" x="310" y="754">data-driven stop; optional refine</text>

  <!-- Feedback -->
  <path d="M200,738 L70,738 L70,206 L200,206" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="caption" x="70" y="470" transform="rotate(-90 70 470)">refine question, cohort, or features</text>

  <!-- Legend -->
  <text class="caption" x="310" y="820">Italic = LLM-capable agent · Roman = deterministic / data component</text>
</svg>
