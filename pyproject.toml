[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-radiogen"
version = "0.1.0"
description = "Disease-agnostic agentic radiogenomics framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pydicom>=2.4",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
imaging-gpu = ["torch", "totalsegmentator", "nibabel"]

[tool.setuptools.packages.find]
include = ["agentic_radiogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
